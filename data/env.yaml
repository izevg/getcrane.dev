# Переменные окружения CRANE: источник шорткода {{< env >}}, подсказок в блоках кода
# и страницы reference/environment-variables. Только то, что читает код сейчас
# (crates/entry/server/src/config), включая AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY; без CRANE_TEST_*. Ведёт руководитель документации; заполняет писатель справочника.
#
# Поля:
#   default   — значение по умолчанию как в коде; null — нет значения
#   required  — true, если сервер не стартует без переменной
#   file      — есть ли форма <ИМЯ>_FILE (отдельной записью не заводится)
#   secret    — значение секретное: значение по умолчанию не показывается, подсказка советует <ИМЯ>_FILE
#   toml      — ключ файла CRANE_CONFIG или null, если только окружение
#   anchor    — якорь строки на странице reference/environment-variables
#   ru/en     — одно предложение о назначении
#
# Пример записи (заполняется при написании справочника):
#
# CRANE_NAMESPACES:
#   default: ""
#   required: false
#   file: false
#   secret: false
#   toml: namespaces
#   anchor: crane-namespaces
#   ru: "Резервирование внутренних имён: записи формат:шаблон через запятую."
#   en: "Reserves internal names: comma-separated format:pattern entries."
