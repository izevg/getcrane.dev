# Конфигурация сайта getcrane.dev. Нужен Hugo extended >= 0.157 (см. package.json, поле hugo).
baseURL: https://getcrane.dev/
title: CRANE
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
# Корень «/» — отдельный EN-лендинг (формат RootHTML), поэтому редирект Hugo на язык по умолчанию выключен.
disableDefaultLanguageRedirect: true
disableHugoGeneratorInject: true
printI18nWarnings: true
disableKinds: [taxonomy, term, rss]
enableGitInfo: false
timeout: 120s

languages:
  en:
    languageCode: en
    languageName: English
    contentDir: content/en
    weight: 1
  ru:
    languageCode: ru
    languageName: Русский
    contentDir: content/ru
    weight: 2

params:
  # Ссылки на репозитории. Пустое значение: ссылка не выводится, сборка пишет предупреждение.
  sourceURL: ""
  siteSourceURL: https://github.com/izevg/getcrane.dev
  license: Apache-2.0
  # Режим проверки env: true — неизвестное CRANE_* в блоке кода ломает сборку (MUST по ui-spec).
  envStrict: true
  # Снимки экрана: true — отсутствующий файл ломает сборку, false — выводится плейсхолдер.
  screenshotsRequired: false

# Выходные форматы: HTML, Markdown-версия страницы и llms.txt. llms-full.txt собирает scripts/postbuild.ts из готовых .md:
# шорткоды внутри страницы Hugo разворачивает в формате самой страницы, поэтому из шаблона главной Markdown-версию других страниц не получить.
outputs:
  home: [HTML, LLMS]
  section: [HTML, Markdown]
  page: [HTML, Markdown]

# Только главная EN дополнительно пишется в корень: «/» (лендинг), «/llms.txt», «/versions.json» (список версий) и «/pages.json» (пути страниц этой сборки).
cascade:
  - target:
      kind: home
      sites:
        matrix:
          languages: [en]
    outputs: [HTML, RootHTML, LLMS, LLMSRoot, VersionsJSON, PagesJSON]

mediaTypes:
  text/markdown:
    suffixes: [md]

outputFormats:
  # ugly: файл лежит рядом с каталогом страницы: /en/start/quickstart.md
  Markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    rel: alternate
    ugly: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    permalinkable: false
  LLMSRoot:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    permalinkable: false
    root: true
  # Манифесты версий документации (design/versions-spec.md, A3): их читает селектор версий и страница 404.
  VersionsJSON:
    mediaType: application/json
    baseName: versions
    isPlainText: true
    notAlternative: true
    permalinkable: false
    root: true
  PagesJSON:
    mediaType: application/json
    baseName: pages
    isPlainText: true
    notAlternative: true
    permalinkable: false
    root: true
  RootHTML:
    mediaType: text/html
    baseName: index
    isHTML: true
    notAlternative: true
    permalinkable: false
    root: true

markup:
  goldmark:
    renderer:
      # Сырой HTML в тексте не нужен: разметка идёт шорткодами и render-хуками.
      unsafe: false
    parser:
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    extensions:
      # Кавычки и тире ставит писатель; шаблон их не заменяет.
      typographer:
        disable: true
      # Голый URL в тексте становится автоссылкой и ломает сборку в _markup/render-link.html (текст равен адресу): отдельной проверки в TypeScript нет.
      linkify: true
      strikethrough: true
      table: true
      taskList: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: false
    tabWidth: 2

minify:
  tdewolff:
    html:
      keepQuotes: true
      keepEndTags: true
      keepWhitespace: true

build:
  buildStats:
    enable: false

sitemap:
  changefreq: weekly
  priority: 0.5
