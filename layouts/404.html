{{ define "main" }}
<div class="menu-host" id="site-nav"><nav aria-label="{{ i18n "nav.sections" }}" data-pagefind-ignore>{{ partial "nav/tree.html" (dict "cur" . "pages" site.Home.Sections "root" true) }}</nav></div>
<main id="content" class="container notfound">
  <h1>{{ i18n "404.title" }}</h1>
  <p>{{ i18n "404.text" }}</p>
  {{ with site.GetPage "start" }}<a class="btn btn-primary btn-lg" href="{{ .RelPermalink }}">{{ i18n "404.home" }}</a>{{ end }}
</main>
{{ end }}
