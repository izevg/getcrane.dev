# Тексты главной getcrane.dev. Ведёт руководитель документации: заполнено по страницам Features.
# Шаблон (layouts/_partials/home/) тексты не сочиняет: пустое поле не выводится.
# Каждое утверждение hero и карточек гарантий должно опираться на страницу Features
# и вести на неё; механизм со статусом in-development нельзя подавать как доступный.
#
# Пути href — от корня языка, как в xref (например features/security/immutable-versions).
# Сборка проверяет: путь существует; availability совпадает со status страницы-цели.
#
# Структура языковых полей та же, что в glossary.yaml: ru / en.

hero:
  ru:
    overline: "Self-hosted реестр пакетов и proxy публичных реестров"
    title: "Реестр пакетов, который проверяет то, что попадает в сборку"
    lead: "Опубликованная версия не меняется, байты сверяются по дайджесту, внутреннее имя не придёт из публичного реестра. У каждой гарантии названы границы."
  en:
    overline: "Self-hosted package registry and proxy for public registries"
    title: "A package registry that checks what goes into your build"
    lead: "A published version never changes, bytes are checked against their digest, and an internal name never comes from a public registry. Every guarantee states its limits."
  # Подпись кнопки: глагол + объект; пустая — берётся title страницы-цели.
  primary:   { href: start/quickstart, ru: "Запустить CRANE", en: "Run CRANE" }
  secondary: { href: features/security/supply-chain-threats, ru: "Посмотреть угрозы и гарантии", en: "See threats and guarantees" }

# Схема «путь пакета» в hero: upstream → группа CRANE → клиент сборки.
# Подписи узлов — метки до 2 слов. Узлы группы — ссылки на страницы гарантий.
# icon — имя Lucide (assets/icons/manifest.json); note — необязательная строка-пояснение под подписью (пустая не выводится).
path:
  upstream: { icon: globe, ru: "Публичный реестр", en: "Public registry", note: { ru: "crates.io, npm и другие", en: "crates.io, npm and others" } }
  client:   { icon: package, ru: "Сборка", en: "Build", note: { ru: "получает проверенные байты", en: "receives checked bytes" } }
  nodes:
    - { href: features/security/namespace-reservation,  icon: folder-lock, ru: "Namespace", en: "Namespace", note: { ru: "внутреннее имя не придёт извне", en: "internal names stay internal" } }
    - { href: features/security/upstream-quarantine,    icon: hourglass, ru: "Карантин", en: "Quarantine", note: { ru: "свежая версия выдерживает окно", en: "fresh versions wait out a window" } }
    - { href: features/security/digest-verification,    icon: fingerprint-pattern, ru: "Дайджест", en: "Digest", note: { ru: "байты сверяются по SHA-256", en: "bytes checked against SHA-256" } }
    - { href: features/security/immutable-versions,     icon: lock, ru: "Неизменяемость", en: "Immutability", note: { ru: "выпущенная версия не меняется", en: "a released version never changes" } }

# Снимки Storybook веб-консоли: файлы — assets/screens/<история>/<вариант>.<ext>, размеры берёт Hugo из самих файлов.
# shot — «История/СветлыйВариант»; тёмный и английский варианты записи берутся из data/screen-pairs.yaml (EN: один снимок в обеих темах).
# Пустой alt не выводит снимок. Подписи всегда заканчиваются пометкой «Демонстрационные данные» / «Demo data» (добавляет шаблон).
screens:
  hero: { shot: "S2Package/DesktopLight", ru: { alt: "Карточка пакета в веб-консоли CRANE: версии, команда установки и сведения о пакете" }, en: { alt: "A package page in the CRANE web console: versions, the install command and package details" } }

# Секция «Веб-консоль»: три снимка с подписью-ссылкой на гарантию. Секция выводится, если заполнена подпись (caption) хотя бы у одной записи.
console:
  - { shot: "S3Versions/Desktop1440Sheet", href: features/security/immutable-versions, ru: { caption: "Версии пакета: состояние каждой версии и панель подробностей", alt: "Список версий пакета в веб-консоли с состоянием каждой версии и открытой панелью подробностей" }, en: { caption: "Package versions: the state of each version and a details panel", alt: "The list of package versions in the web console with the state of each version and an open details panel" } }
  - { shot: "S9Journal/Desktop1440", href: features/security/security-journal, ru: { caption: "Журнал действий: кто, что и когда сделал", alt: "Журнал действий в веб-консоли: список событий с автором, действием и временем" }, en: { caption: "The action journal: who did what and when", alt: "The action journal in the web console: a list of events with the actor, the action and the time" } }
  - { shot: "S1Search/DesktopLight", href: features/registry/search, ru: { caption: "Поиск пакетов по задаче, а не только по имени", alt: "Поиск пакетов в веб-консоли: строка запроса и карточки найденных пакетов" }, en: { caption: "Package search by task, not only by name", alt: "Package search in the web console: the query field and cards of the packages found" } }

# Карточки гарантий: 6–8 штук. Первые две занимают по 6 колонок из 12 на широком экране.
# href — страница Features; current — необязательная страница текущего состояния, со status которой
# сверяется availability (available | in-development).
guarantees:
  - href: features/security/immutable-versions
    icon: lock
    current: formats/cargo
    availability: available
    ru: { title: "Неизменяемые версии", claim: "Выпущенную версию нельзя перезаписать, а номер удалённой версии нельзя занять снова.", limit: "CRANE не оценивает содержимое версии: он хранит и скрывает, но не судит, безопасна ли она." }
    en: { title: "Immutable versions", claim: "A released version cannot be overwritten, and the number of a deleted version cannot be taken again.", limit: "CRANE does not judge the content of a version: it stores and hides it, but does not decide whether it is safe." }
  - href: features/security/digest-verification
    icon: fingerprint-pattern
    availability: available
    ru: { title: "Проверка дайджестов", claim: "Файлы хранятся по SHA-256, а скачанное из upstream сверяется с ожидаемым дайджестом.", limit: "Где upstream не сообщает ожидаемый дайджест, сверять не с чем." }
    en: { title: "Digest verification", claim: "Files are stored under their SHA-256, and what is fetched from an upstream is checked against the expected digest.", limit: "Where the upstream gives no expected digest, there is nothing to check against." }
  - href: features/security/namespace-reservation
    icon: folder-lock
    current: configure/namespaces
    availability: available
    ru: { title: "Резервирование namespace", claim: "Внутреннее имя никогда не отдаётся из upstream: на него proxy отвечает 404.", limit: "Пакеты npm без scope этой защитой не покрываются." }
    en: { title: "Namespace reservation", claim: "An internal name is never served from an upstream: the proxy answers 404 for it.", limit: "Unscoped npm packages are not covered by this protection." }
  - href: features/security/public-upstreams-only
    icon: globe-lock
    availability: available
    ru: { title: "Только публичные upstream", claim: "Адреса upstream встроены в бинарник; приватный или произвольный реестр подключить нельзя.", limit: "Пакет, перенесённый вручную в hosted, CRANE проверяет как обычную публикацию, а отвечает за него публикующий." }
    en: { title: "Public upstreams only", claim: "Upstream addresses are built into the binary; a private or arbitrary registry cannot be attached.", limit: "A package moved into a hosted repository by hand gets the checks of a normal publication, and the publisher is accountable for it." }
  - href: features/security/egress-guard
    icon: shield-ban
    availability: available
    ru: { title: "Контроль исходящих запросов", claim: "Каждый адрес после DNS и каждый redirect проверяются: запрос не уйдёт во внутреннюю сеть.", limit: "Сеть вокруг процесса защищают правила развёртывания, а не CRANE." }
    en: { title: "Egress control", claim: "Every address after DNS and every redirect is checked, so a request does not reach the internal network.", limit: "The network around the process is protected by the deployment's rules, not by CRANE." }
  - href: features/security/fail-closed
    icon: door-closed
    availability: available
    ru: { title: "Отказ в закрытую сторону", claim: "Без каталога CRANE отвечает 503, а не отдаёт пакеты без проверок.", limit: "Цена — недоступность чтения, пока каталог не вернётся." }
    en: { title: "Fail closed", claim: "Without its catalog CRANE answers 503 instead of serving packages unchecked.", limit: "The price is that reads are unavailable until the catalog is back." }
  - href: features/security/upstream-quarantine
    icon: hourglass
    current: configure/upstream-quarantine
    availability: in-development
    ru: { title: "Карантин новых версий", claim: "Свежая версия из upstream выдерживается окном до выдачи клиентам proxy.", limit: "Окно выигрывает время, но не обнаруживает вредоносность." }
    en: { title: "Quarantine for new versions", claim: "A fresh upstream version waits out a window before proxy clients receive it.", limit: "The window buys time; it does not detect malware." }
  - href: features/security/vulnerability-flow
    icon: radar
    current: configure/vulnerability-feeds
    availability: in-development
    ru: { title: "Поток уязвимостей", claim: "Advisory из открытых фидов сопоставляются с инвентарём по PURL, вредоносные версии блокируются.", limit: "CRANE агрегирует открытые фиды и не ведёт собственных исследований." }
    en: { title: "Vulnerability flow", claim: "Advisories from open feeds are matched against the inventory by PURL, and malicious versions are blocked.", limit: "CRANE aggregates open feeds and does no research of its own." }

# Четыре входа по аудиториям (ia.md, столбцы «Что ищет» и «Вход»). Ссылок 2–3.
audiences:
  - id: developer
    ru:
      seeks: "Подключить клиент, опубликовать, понять отказ"
    en:
      seeks: "Connect a client, publish, understand a refusal"
    links: [start/, formats/, start/quickstart]
  - id: platform
    ru:
      seeks: "Развернуть, настроить, обслуживать, масштабировать"
    en:
      seeks: "Deploy, configure, operate, scale"
    links: [deploy/, configure/, operations/]
  - id: security
    ru:
      seeks: "Какие угрозы закрыты, где границы, что видно в журнале ИБ и SIEM"
    en:
      seeks: "Which threats are closed, where the limits are, what the security journal and the SIEM show"
    links: [features/security/, security/]
  - id: auditor
    ru:
      seeks: "Что регистрируется, кто имеет доступ к журналу, как проверить целостность"
    en:
      seeks: "What is recorded, who can read the journal, how to verify integrity"
    links: [features/security/, security/, reference/]

# Плитки форматов. Строка под названием — description страницы formats/<id>.
formats: [cargo, npm, pypi, maven, nuget]

# Карточки развёртывания.
deploy:
  - id: binary
    icon: terminal
    href: reference/server-cli
    ru: { title: "Один бинарник", text: "Сервер, миграции и проба готовности — роли одного бинарника crane в одном образе.", command: "crane migrate" }
    en: { title: "One binary", text: "The server, migrations and the readiness probe are roles of one crane binary in one image.", command: "crane migrate" }
  - id: compose
    icon: container
    href: deploy/docker-compose
    ru: { title: "Docker Compose на одном узле", text: "Caddy, PostgreSQL и CRANE; S3 и Valkey подключаются override-файлами.", command: "docker compose --project-directory . -f deploy/compose/docker-compose.yaml up -d --wait" }
    en: { title: "Docker Compose on one node", text: "Caddy, PostgreSQL and CRANE; S3 and Valkey are added with override files.", command: "docker compose --project-directory . -f deploy/compose/docker-compose.yaml up -d --wait" }
  - id: kubernetes
    icon: ship-wheel
    href: deploy/kubernetes-helm
    ru: { title: "Kubernetes и Helm", text: "Helm-чарт с внешними PostgreSQL, Valkey и S3. Функциональность в разработке.", command: "" }
    en: { title: "Kubernetes and Helm", text: "A Helm chart with external PostgreSQL, Valkey and S3. This functionality is in development.", command: "" }

# Полоса «Начало работы»: подписи берутся из title страниц.
start: [start/, start/quickstart, start/concepts, deploy/requirements]
