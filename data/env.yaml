# Переменные окружения CRANE: источник шорткода {{< env >}}, подсказок в блоках кода
# и страницы reference/environment-variables. Только то, что читает код сейчас
# (crates/entry/server/src/config и main.rs), включая AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY; без CRANE_TEST_*. Ведёт руководитель документации; заполняет писатель справочника.
#
# Поля:
#   default   — значение по умолчанию как в коде; null — нет значения
#   required  — true, если сервер не стартует без переменной
#   file      — есть ли форма <ИМЯ>_FILE (отдельной записью не заводится)
#   scope     — server (читает бинарник crane, по умолчанию), compose (переменная файла .env для Docker Compose) или ci (имя в примерах конфигурации CI)
#   secret    — значение секретное: значение по умолчанию не показывается, подсказка советует <ИМЯ>_FILE
#   toml      — ключ файла CRANE_CONFIG или null, если только окружение
#   anchor    — якорь строки на странице reference/environment-variables
#   ru/en     — одно предложение о назначении

CRANE_CONFIG:
  default: null
  required: false
  file: false
  secret: false
  toml: null
  anchor: crane-config
  ru: "Путь к необязательному файлу TOML с настройками; задаётся только окружением."
  en: "Path to an optional TOML settings file; set only through the environment."

CRANE_HTTP_PORT:
  default: "8080"
  required: false
  file: false
  secret: false
  toml: http_port
  anchor: crane-http-port
  ru: "Порт API: протоколы пакетов."
  en: "API port: the package protocols."

CRANE_ADMIN_PORT:
  default: "9464"
  required: false
  file: false
  secret: false
  toml: admin_port
  anchor: crane-admin-port
  ru: "Порт проб /healthz/live и /healthz/ready; его читает и команда crane healthcheck."
  en: "Port of the /healthz/live and /healthz/ready probes; the crane healthcheck command reads it too."

CRANE_PUBLIC_URL:
  default: null
  required: true
  file: false
  secret: false
  toml: public_url
  anchor: crane-public-url
  ru: "Внешний адрес CRANE (http:// или https://): от него строятся ссылки в ответах протоколов."
  en: "External address of CRANE (http:// or https://); links in protocol responses are built from it."

CRANE_TRUSTED_PROXIES:
  default: ""
  required: false
  file: false
  secret: false
  toml: trusted_proxies
  anchor: crane-trusted-proxies
  ru: "IP-адреса и сети CIDR через запятую, чьим заголовкам X-Forwarded-For и X-Request-Id верит сервер."
  en: "Comma-separated IP addresses and CIDR networks whose X-Forwarded-For and X-Request-Id headers the server trusts."

CRANE_TOKEN:
  default: null
  required: true
  file: true
  secret: true
  toml: token
  anchor: crane-token
  ru: "Статический токен доступа к протоколам пакетов; задаётся этой переменной или файлом, но не обоими."
  en: "Static access token for the package protocols; set by this variable or by a file, not both."

CRANE_TOKEN_PRINCIPAL:
  default: "crane"
  required: false
  file: false
  secret: false
  toml: token_principal
  anchor: crane-token-principal
  ru: "Имя принципала токена: оно попадает в журнал аудита, журнал доступа и ответ owners для cargo."
  en: "Name of the token principal; it appears in the audit log, the access log and the cargo owners response."

CRANE_DATABASE_URL:
  default: null
  required: true
  file: true
  secret: true
  toml: database_url
  anchor: crane-database-url
  ru: "Адрес каталога: postgres:// или postgresql:// либо memory для каталога в памяти."
  en: "Catalog address: postgres:// or postgresql://, or memory for an in-memory catalog."

CRANE_BLOBS:
  default: null
  required: true
  file: false
  secret: false
  toml: blobs
  anchor: crane-blobs
  ru: "Хранилище blob: memory, file:///абсолютный/путь или s3://бакет с несекретными параметрами запроса."
  en: "Blob storage: memory, file:///absolute/path or s3://bucket with non-secret query parameters."

CRANE_SETTINGS_KEY:
  default: null
  required: false
  file: true
  secret: true
  toml: settings_key
  anchor: crane-settings-key
  ru: "Ключ шифрования секретов настроек в PostgreSQL: base64 от 32 байт (AES-256-GCM)."
  en: "Encryption key for secret settings stored in PostgreSQL: base64 of 32 bytes (AES-256-GCM)."

CRANE_CACHE:
  default: "memory"
  required: false
  file: true
  secret: true
  toml: cache
  anchor: crane-cache
  ru: "Кэш proxy и координатор выборок: memory или адрес Valkey (valkey://, valkeys://, -cluster, -sentinel)."
  en: "Proxy cache and fetch coordinator: memory or a Valkey address (valkey://, valkeys://, -cluster, -sentinel)."

CRANE_PROXY_MAX_ARTIFACT_BYTES:
  default: "2147483648"
  required: false
  file: false
  secret: false
  toml: proxy_max_artifact_bytes
  anchor: crane-proxy-max-artifact-bytes
  ru: "Предел размера одного проксируемого артефакта в байтах; значение больше нуля."
  en: "Size limit of a single proxied artifact in bytes; the value must be greater than zero."

CRANE_MAX_PUBLISH_BYTES:
  default: "10485760"
  required: false
  file: false
  secret: false
  toml: max_publish_bytes
  anchor: crane-max-publish-bytes
  ru: "Предел размера тела публикации в байтах для cargo и npm; значение больше нуля."
  en: "Size limit of a publish request body in bytes for cargo and npm; the value must be greater than zero."

CRANE_CARGO_REPOS:
  default: "internal"
  required: false
  file: false
  secret: false
  toml: cargo_repos
  anchor: crane-cargo-repos
  ru: "Имена hosted-репозиториев Cargo через запятую."
  en: "Comma-separated names of the Cargo hosted repositories."

CRANE_CARGO_PROXY_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: cargo_proxy_repos
  anchor: crane-cargo-proxy-repos
  ru: "Имена proxy-репозиториев crates.io через запятую; пустое значение выключает proxy Cargo."
  en: "Comma-separated names of the crates.io proxy repositories; an empty value disables the Cargo proxy."

CRANE_NPM_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_repos
  anchor: crane-npm-repos
  ru: "Имена hosted-репозиториев npm через запятую; пустое значение не создаёт репозиториев."
  en: "Comma-separated names of the npm hosted repositories; an empty value creates none."

CRANE_NPM_PROXY_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_proxy_repos
  anchor: crane-npm-proxy-repos
  ru: "Имена proxy-репозиториев registry.npmjs.org через запятую; пустое значение выключает proxy npm."
  en: "Comma-separated names of the registry.npmjs.org proxy repositories; an empty value disables the npm proxy."

CRANE_NAMESPACES:
  default: ""
  required: false
  file: false
  secret: false
  toml: namespaces
  anchor: crane-namespaces
  ru: "Резервирование внутренних имён: записи формат:шаблон или формат:шаблон=uuid-workspace через запятую."
  en: "Reserves internal names: comma-separated format:pattern or format:pattern=workspace-uuid entries."

AWS_ACCESS_KEY_ID:
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-access-key-id
  ru: "Идентификатор статического ключа S3; нужен вместе с AWS_SECRET_ACCESS_KEY при хранилище blob s3://."
  en: "Static S3 key identifier; used together with AWS_SECRET_ACCESS_KEY when blob storage is s3://."

AWS_SECRET_ACCESS_KEY:
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-secret-access-key
  ru: "Секретная часть статического ключа S3; нужна вместе с AWS_ACCESS_KEY_ID."
  en: "Secret part of the static S3 key; used together with AWS_ACCESS_KEY_ID."

RUST_LOG:
  default: "info"
  required: false
  file: false
  secret: false
  toml: null
  anchor: rust-log
  ru: "Уровень обычных логов в синтаксисе tracing-subscriber; события журнала ИБ он не отключает."
  en: "Level of the ordinary logs in tracing-subscriber syntax; it does not turn off security journal events."

# ── Переменные файла .env для Docker Compose (scope: compose) ──
# Источник: .env.dist и deploy/compose/*. default — значение из шаблона .env.dist: в compose-файлах умолчаний нет,
# пропущенная переменная останавливает запуск (required: true у всех).

CRANE_HOST:
  scope: compose
  default: "localhost"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-host
  ru: "Публичное имя хоста: Caddy обслуживает его и получает сертификат; из него выводится CRANE_PUBLIC_URL."
  en: "Public host name: Caddy serves it and obtains a certificate for it; CRANE_PUBLIC_URL is derived from it."

CRANE_EDGE_SUBNET:
  scope: compose
  default: "172.31.250.0/24"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-edge-subnet
  ru: "Подсеть сети edge, в которой только caddy и crane; передаётся серверу как CRANE_TRUSTED_PROXIES."
  en: "Subnet of the edge network that holds only caddy and crane; passed to the server as CRANE_TRUSTED_PROXIES."

CRANE_IMAGE:
  scope: compose
  default: "crane/crane"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-image
  ru: "Имя образа CRANE."
  en: "Name of the CRANE image."

CRANE_VERSION:
  scope: compose
  default: "latest"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-version
  ru: "Тег образа CRANE."
  en: "Tag of the CRANE image."

CRANE_CPUS:
  scope: compose
  default: "2"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-cpus
  ru: "Предел CPU контейнера crane."
  en: "CPU limit of the crane container."

CRANE_MEMORY:
  scope: compose
  default: "1g"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-memory
  ru: "Предел памяти контейнера crane."
  en: "Memory limit of the crane container."

CRANE_TOKEN_SECRET:
  scope: compose
  default: "./secrets/crane_token"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-token-secret
  ru: "Путь к файлу со статическим токеном доступа к протоколам."
  en: "Path to the file with the static protocol access token."

CRANE_DATABASE_URL_SECRET:
  scope: compose
  default: "./secrets/database_url"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-database-url-secret
  ru: "Путь к файлу с полным URL каталога PostgreSQL."
  en: "Path to the file with the full PostgreSQL catalog URL."

POSTGRES_PASSWORD_SECRET:
  scope: compose
  default: "./secrets/postgres_password"
  required: true
  file: false
  secret: false
  toml: null
  anchor: postgres-password-secret
  ru: "Путь к файлу с паролем PostgreSQL."
  en: "Path to the file with the PostgreSQL password."

S3_ACCESS_KEY_ID_SECRET:
  scope: compose
  default: "./secrets/s3_access_key_id"
  required: true
  file: false
  secret: false
  toml: null
  anchor: s3-access-key-id-secret
  ru: "Путь к файлу с идентификатором ключа S3; нужен только в режиме S3."
  en: "Path to the file with the S3 access key ID; needed only in S3 mode."

S3_SECRET_ACCESS_KEY_SECRET:
  scope: compose
  default: "./secrets/s3_secret_access_key"
  required: true
  file: false
  secret: false
  toml: null
  anchor: s3-secret-access-key-secret
  ru: "Путь к файлу с секретным ключом S3; нужен только в режиме S3."
  en: "Path to the file with the S3 secret access key; needed only in S3 mode."

VALKEY_PASSWORD_SECRET:
  scope: compose
  default: "./secrets/valkey_password"
  required: true
  file: false
  secret: false
  toml: null
  anchor: valkey-password-secret
  ru: "Путь к файлу с паролем пользователя crane в Valkey; нужен только в режиме Valkey."
  en: "Path to the file with the password of the crane user in Valkey; needed only in Valkey mode."

CRANE_CACHE_URL_SECRET:
  scope: compose
  default: "./secrets/cache_url"
  required: true
  file: false
  secret: false
  toml: null
  anchor: crane-cache-url-secret
  ru: "Путь к файлу с полным URL Valkey; сервер читает его через CRANE_CACHE_FILE."
  en: "Path to the file with the full Valkey URL; the server reads it through CRANE_CACHE_FILE."

S3_BUCKET:
  scope: compose
  default: "blobs"
  required: true
  file: false
  secret: false
  toml: null
  anchor: s3-bucket
  ru: "Имя бакета, которое создаёт seaweedfs-init; совпадает с бакетом в CRANE_BLOBS."
  en: "Bucket name created by seaweedfs-init; must match the bucket in CRANE_BLOBS."

CADDY_HTTP_PORT:
  scope: compose
  default: "80"
  required: true
  file: false
  secret: false
  toml: null
  anchor: caddy-http-port
  ru: "Порт HTTP на хосте."
  en: "HTTP port on the host."

CADDY_HTTPS_PORT:
  scope: compose
  default: "443"
  required: true
  file: false
  secret: false
  toml: null
  anchor: caddy-https-port
  ru: "Порт HTTPS на хосте."
  en: "HTTPS port on the host."

VALKEY_MAXMEMORY:
  scope: compose
  default: "512mb"
  required: true
  file: false
  secret: false
  toml: null
  anchor: valkey-maxmemory
  ru: "Предел памяти Valkey; политика вытеснения allkeys-lru зафиксирована в compose-файле."
  en: "Valkey memory limit; the allkeys-lru eviction policy is fixed in the compose file."

POSTGRES_USER:
  scope: compose
  default: "crane"
  required: true
  file: false
  secret: false
  toml: null
  anchor: postgres-user
  ru: "Пользователь PostgreSQL контейнера postgres."
  en: "PostgreSQL user of the postgres container."

POSTGRES_DB:
  scope: compose
  default: "crane"
  required: true
  file: false
  secret: false
  toml: null
  anchor: postgres-db
  ru: "База каталога в контейнере postgres."
  en: "Catalog database in the postgres container."

CADDY_IMAGE:
  scope: compose
  default: "caddy:2.11.7@sha256:…"
  required: true
  file: false
  secret: false
  toml: null
  anchor: caddy-image
  ru: "Образ Caddy с тегом и дайджестом."
  en: "Caddy image with tag and digest."

POSTGRES_IMAGE:
  scope: compose
  default: "pgvector/pgvector:0.8.7-pg17-bookworm@sha256:…"
  required: true
  file: false
  secret: false
  toml: null
  anchor: postgres-image
  ru: "Образ PostgreSQL с pgvector, тег и дайджест."
  en: "PostgreSQL image with pgvector, tag and digest."

VALKEY_IMAGE:
  scope: compose
  default: "valkey/valkey:8.1.11@sha256:…"
  required: true
  file: false
  secret: false
  toml: null
  anchor: valkey-image
  ru: "Образ Valkey с тегом и дайджестом."
  en: "Valkey image with tag and digest."

SEAWEEDFS_IMAGE:
  scope: compose
  default: "chrislusf/seaweedfs:4.51@sha256:…"
  required: true
  file: false
  secret: false
  toml: null
  anchor: seaweedfs-image
  ru: "Образ SeaweedFS с тегом и дайджестом."
  en: "SeaweedFS image with tag and digest."

# ── Переменные CI (scope: ci): имена в примерах конфигурации CI, сервер их не читает ──

CRANE_ID_TOKEN:
  scope: ci
  default: null
  required: false
  file: false
  secret: true
  toml: null
  anchor: crane-id-token
  ru: "ID-токен задачи GitLab CI с аудиторией crane, который задача публикации обменивает на краткоживущий токен CRANE."
  en: "The GitLab CI job ID token with the crane audience that the publish job exchanges for a short-lived CRANE token."
