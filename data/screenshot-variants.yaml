# Размеры снимков Storybook веб-консоли (резерв места через width/height у <img>).
# Источник — web/screens/frame/screen.ts: вьюпорт desktop 1440×900, mobile 390×844, mobile320 320×640; wide 1600×900 задан в историях S3 и S9.
# Ключ — начало имени варианта: Desktop1440Sheet подходит к ключу Desktop1440 (берётся самое длинное совпадение).
# Ключ «История/Вариант» (с косой чертой) выигрывает у общего: он нужен, где одноимённый вариант снимается в другом вьюпорте.
# Снято Chromium Playwright из собранного Storybook с CRANE_UI_DEMO=1, devicePixelRatio 1, reduced motion; файлы — static/screens/<История>/<Вариант>.{avif,webp}.
Desktop1440: { width: 1440, height: 900 }
DesktopLight: { width: 1440, height: 900 }
DesktopDark: { width: 1440, height: 900 }
English: { width: 1440, height: 900 }
Forbidden: { width: 1440, height: 900 }
Tablet768: { width: 768, height: 1024 }
Mobile390: { width: 390, height: 844 }
Fit320: { width: 320, height: 640 }
# DesktopDark журнала снят в wide-вьюпорте (панель docked справа от таблицы).
S9Journal/DesktopDark: { width: 1600, height: 900 }
