# Версии документации CRANE (design/versions-spec.md, вариант B: корень — последний выпуск).
# Порядок записей — порядок показа и «возраст»: сверху самая новая (next, затем current, затем previous по убыванию).
# До первого выпуска запись одна; пока версий меньше двух, селектор в шапке, чипы версий и блок в панели «Меню» не выводятся.
#
# Поля записи:
#   id      — уникальный идентификатор, его же пишут в front matter (since, until, changed). Номер в кавычках: "0.3".
#   label   — подпись версии: строка для пронумерованных версий («0.3») или { ru, en } для именованных (current, next).
#   status  — current (читаемый выпуск; ровно одна запись), next (сборка из main, номер не выводится), previous (прежний выпуск).
#   path    — путь версии от корня сайта с косой чертой на конце: "/" для current, "/next/", "/v0.3/" для архивов.
#   date    — дата выпуска, ГГГГ-ММ-ДД (необязательна; у next её нет).
#   upgrade — путь страницы «Обновление» от корня языка, необязательно (OPEN 8 спеки).
- id: current
  label: { ru: "Текущая", en: "Current" }
  status: current
  path: "/"
