# Переменные окружения CRANE: источник шорткода {{< env >}}, подсказок в блоках кода
# и страницы reference/environment-variables. Только то, что читает код сейчас
# (crates/entry/server/src/config и main.rs), включая AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY; без CRANE_TEST_*. Ведёт руководитель документации; заполняет писатель справочника.
#
# Поля:
#   default   — значение по умолчанию как в коде; null — нет значения
#   required  — true, если сервер не стартует без переменной
#   file      — есть ли форма <ИМЯ>_FILE (отдельной записью не заводится)
#   group     — группа строки в справочнике (config, network, access, storage, limits, repositories, logging); для scope: server
#   scope     — server (читает бинарник crane, по умолчанию), compose (переменная файла .env для Docker Compose) или ci (имя в примерах конфигурации CI)
#   secret    — значение секретное: значение по умолчанию не показывается, подсказка советует <ИМЯ>_FILE
#   toml      — ключ файла CRANE_CONFIG или null, если только окружение
#   anchor    — якорь строки на странице reference/environment-variables
#   ru/en     — одно предложение о назначении (подсказка)
#   table     — ru/en: полный текст колонки «Назначение» в справочнике (markdown); без него берётся ru/en

CRANE_CONFIG:
  group: config
  default: null
  required: false
  file: false
  secret: false
  toml: null
  anchor: crane-config
  ru: "Путь к необязательному файлу TOML с настройками; задаётся только окружением."
  en: "Path to an optional TOML settings file; set only through the environment."
  table:
    ru: "Путь к необязательному файлу TOML. Пустое значение — файла нет"
    en: "Path to the optional TOML file. An empty value means no file"

CRANE_HTTP_PORT:
  group: network
  default: "8080"
  required: false
  file: false
  secret: false
  toml: http_port
  anchor: crane-http-port
  ru: "Порт API: протоколы пакетов."
  en: "API port: the package protocols."
  table:
    ru: "Порт API с протоколами пакетов; целое число 0–65535"
    en: "API port with the package protocols; an integer 0–65535"

CRANE_ADMIN_PORT:
  group: network
  default: "9464"
  required: false
  file: false
  secret: false
  toml: admin_port
  anchor: crane-admin-port
  ru: "Порт проб /healthz/live и /healthz/ready; его читает и команда crane healthcheck."
  en: "Port of the /healthz/live and /healthz/ready probes; the crane healthcheck command reads it too."
  table:
    ru: "Порт проб `/healthz/live` и `/healthz/ready`; его читает и `crane healthcheck`"
    en: "Port of the `/healthz/live` and `/healthz/ready` probes; `crane healthcheck` reads it too"

CRANE_PUBLIC_URL:
  group: network
  default: null
  required: true
  file: false
  secret: false
  toml: public_url
  anchor: crane-public-url
  ru: "Внешний адрес CRANE (http:// или https://): от него строятся ссылки в ответах протоколов."
  en: "External address of CRANE (http:// or https://); links in protocol responses are built from it."
  table:
    ru: "Внешний адрес: `http://` или `https://` и хост; завершающие `/` отбрасываются"
    en: "External address: `http://` or `https://` and a host; trailing `/` are dropped"

CRANE_TRUSTED_PROXIES:
  group: network
  default: ""
  required: false
  file: false
  secret: false
  toml: trusted_proxies
  anchor: crane-trusted-proxies
  ru: "IP-адреса и сети CIDR через запятую, чьим заголовкам X-Forwarded-For и X-Request-Id верит сервер."
  en: "Comma-separated IP addresses and CIDR networks whose X-Forwarded-For and X-Request-Id headers the server trusts."
  table:
    ru: "IP-адреса и сети CIDR (IPv4, IPv6) через запятую, чьим `X-Forwarded-For` и `X-Request-Id` верит сервер"
    en: "Comma-separated IP addresses and CIDR networks (IPv4, IPv6) whose `X-Forwarded-For` and `X-Request-Id` the server trusts"

CRANE_TOKEN:
  group: access
  default: null
  required: true
  file: true
  secret: true
  toml: token
  anchor: crane-token
  ru: "Статический токен доступа к протоколам пакетов; задаётся этой переменной или файлом, но не обоими."
  en: "Static access token for the package protocols; set by this variable or by a file, not both."
  table:
    ru: "Статический токен доступа к протоколам; задаётся значением или файлом, ровно одним способом"
    en: "Static access token for the protocols; set by a value or a file, in exactly one way"

CRANE_TOKEN_PRINCIPAL:
  group: access
  default: "crane"
  required: false
  file: false
  secret: false
  toml: token_principal
  anchor: crane-token-principal
  ru: "Имя принципала токена: оно попадает в журнал аудита, журнал доступа и ответ owners для cargo."
  en: "Name of the token principal; it appears in the audit log, the access log and the cargo owners response."
  table:
    ru: "Имя принципала токена: непустое, без управляющих символов; пробелы по краям отбрасываются"
    en: "Name of the token principal: non-empty, no control characters; surrounding whitespace is dropped"

CRANE_DATABASE_URL:
  group: storage
  default: null
  required: true
  file: true
  secret: true
  toml: database_url
  anchor: crane-database-url
  ru: "Адрес каталога: postgres:// или postgresql:// либо memory для каталога в памяти."
  en: "Catalog address: postgres:// or postgresql://, or memory for an in-memory catalog."
  table:
    ru: "Каталог: `memory`, `postgres://` или `postgresql://`"
    en: "Catalog: `memory`, `postgres://` or `postgresql://`"

CRANE_BLOBS:
  group: storage
  default: null
  required: true
  file: false
  secret: false
  toml: blobs
  anchor: crane-blobs
  ru: "Хранилище blob: memory, file:///абсолютный/путь или s3://бакет с несекретными параметрами запроса."
  en: "Blob storage: memory, file:///absolute/path or s3://bucket with non-secret query parameters."
  table:
    ru: "Blob: `memory`, `file:///абсолютный/путь` или `s3://бакет[/префикс]` с несекретными параметрами запроса"
    en: "Blobs: `memory`, `file:///absolute/path` or `s3://bucket[/prefix]` with non-secret query parameters"

CRANE_SETTINGS_KEY:
  group: storage
  default: null
  required: false
  file: true
  secret: true
  toml: settings_key
  anchor: crane-settings-key
  ru: "Ключ шифрования секретов настроек в PostgreSQL: base64 от 32 байт (AES-256-GCM)."
  en: "Encryption key for secret settings stored in PostgreSQL: base64 of 32 bytes (AES-256-GCM)."
  table:
    ru: "Ключ шифрования секретов настроек в PostgreSQL: base64 от ровно 32 байт (AES-256-GCM). При каталоге `memory` — ошибка"
    en: "Encryption key for secret settings in PostgreSQL: base64 of exactly 32 bytes (AES-256-GCM). An error with the `memory` catalog"

CRANE_CACHE:
  group: limits
  default: "memory"
  required: false
  file: true
  secret: true
  toml: cache
  anchor: crane-cache
  ru: "Кэш proxy и координатор выборок: memory или адрес Valkey (valkey://, valkeys://, -cluster, -sentinel)."
  en: "Proxy cache and fetch coordinator: memory or a Valkey address (valkey://, valkeys://, -cluster, -sentinel)."
  table:
    ru: "Кэш proxy: `memory` или адрес Valkey со схемой `valkey`, `valkeys`, `valkey-cluster`, `valkeys-cluster`, `valkey-sentinel`, `valkeys-sentinel`. Без переменной и формы `_FILE` действует `memory`"
    en: "Proxy cache: `memory` or a Valkey address with the scheme `valkey`, `valkeys`, `valkey-cluster`, `valkeys-cluster`, `valkey-sentinel`, `valkeys-sentinel`. Without the variable and its `_FILE` form, `memory` applies"

CRANE_PROXY_MAX_ARTIFACT_BYTES:
  group: limits
  default: "2147483648"
  required: false
  file: false
  secret: false
  toml: proxy_max_artifact_bytes
  anchor: crane-proxy-max-artifact-bytes
  ru: "Предел размера одного проксируемого артефакта в байтах; значение больше нуля."
  en: "Size limit of a single proxied artifact in bytes; the value must be greater than zero."
  table:
    ru: "Предел размера одного проксируемого артефакта, байты; больше нуля"
    en: "Size limit of a single proxied artifact, bytes; greater than zero"

CRANE_MAX_PUBLISH_BYTES:
  group: limits
  default: "10485760"
  required: false
  file: false
  secret: false
  toml: max_publish_bytes
  anchor: crane-max-publish-bytes
  ru: "Предел размера тела публикации в байтах для cargo и npm; значение больше нуля."
  en: "Size limit of a publish request body in bytes for cargo and npm; the value must be greater than zero."
  table:
    ru: "Предел тела публикации для Cargo и npm, байты; больше нуля"
    en: "Publish body limit for Cargo and npm, bytes; greater than zero"

CRANE_CARGO_REPOS:
  group: repositories
  default: "internal"
  required: false
  file: false
  secret: false
  toml: cargo_repos
  anchor: crane-cargo-repos
  ru: "Имена hosted-репозиториев Cargo через запятую."
  en: "Comma-separated names of the Cargo hosted repositories."
  table:
    ru: "Имена hosted-репозиториев Cargo через запятую; пустое значение — ошибка"
    en: "Comma-separated names of Cargo hosted repositories; an empty value is an error"

CRANE_CARGO_PROXY_REPOS:
  group: repositories
  default: ""
  required: false
  file: false
  secret: false
  toml: cargo_proxy_repos
  anchor: crane-cargo-proxy-repos
  ru: "Имена proxy-репозиториев crates.io через запятую; пустое значение выключает proxy Cargo."
  en: "Comma-separated names of the crates.io proxy repositories; an empty value disables the Cargo proxy."
  table:
    ru: "Имена proxy-репозиториев crates.io через запятую; пусто — proxy Cargo выключен"
    en: "Comma-separated names of crates.io proxy repositories; empty means the Cargo proxy is off"

CRANE_NPM_REPOS:
  group: repositories
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_repos
  anchor: crane-npm-repos
  ru: "Имена hosted-репозиториев npm через запятую; пустое значение не создаёт репозиториев."
  en: "Comma-separated names of the npm hosted repositories; an empty value creates none."
  table:
    ru: "Имена hosted-репозиториев npm через запятую; пусто — репозиториев нет"
    en: "Comma-separated names of npm hosted repositories; empty means none"

CRANE_NPM_PROXY_REPOS:
  group: repositories
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_proxy_repos
  anchor: crane-npm-proxy-repos
  ru: "Имена proxy-репозиториев registry.npmjs.org через запятую; пустое значение выключает proxy npm."
  en: "Comma-separated names of the registry.npmjs.org proxy repositories; an empty value disables the npm proxy."
  table:
    ru: "Имена proxy-репозиториев registry.npmjs.org через запятую; пусто — proxy npm выключен"
    en: "Comma-separated names of registry.npmjs.org proxy repositories; empty means the npm proxy is off"

CRANE_NAMESPACES:
  group: repositories
  default: ""
  required: false
  file: false
  secret: false
  toml: namespaces
  anchor: crane-namespaces
  ru: "Резервирование внутренних имён: записи формат:шаблон или формат:шаблон=uuid-workspace через запятую."
  en: "Reserves internal names: comma-separated format:pattern or format:pattern=workspace-uuid entries."
  table:
    ru: "Резервирование имён: записи `формат:шаблон` или `формат:шаблон=uuid` через запятую"
    en: "Name reservation: comma-separated `format:pattern` or `format:pattern=uuid` entries"

AWS_ACCESS_KEY_ID:
  group: storage
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-access-key-id
  ru: "Идентификатор статического ключа S3; нужен вместе с AWS_SECRET_ACCESS_KEY при хранилище blob s3://."
  en: "Static S3 key identifier; used together with AWS_SECRET_ACCESS_KEY when blob storage is s3://."
  table:
    ru: "Идентификатор статического ключа S3. Значение читает клиент S3; форму `_FILE` читает сервер, парой с секретной частью"
    en: "Identifier of the static S3 key. The S3 client reads the value; the server reads the `_FILE` form, as a pair with the secret part"

AWS_SECRET_ACCESS_KEY:
  group: storage
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-secret-access-key
  ru: "Секретная часть статического ключа S3; нужна вместе с AWS_ACCESS_KEY_ID."
  en: "Secret part of the static S3 key; used together with AWS_ACCESS_KEY_ID."
  table:
    ru: "Секретная часть статического ключа S3"
    en: "Secret part of the static S3 key"

RUST_LOG:
  group: logging
  default: "info"
  required: false
  file: false
  secret: false
  toml: null
  anchor: rust-log
  ru: "Уровень обычных логов в синтаксисе tracing-subscriber; события журнала ИБ он не отключает."
  en: "Level of the ordinary logs in tracing-subscriber syntax; it does not turn off security journal events."
  table:
    ru: "Фильтр обычных логов в синтаксисе `tracing-subscriber`. Неразбираемое значение заменяется на `info`. Цели `crane::audit`, `crane::access` и `crane::upstream` всегда включены на уровне `info`"
    en: "Filter of the ordinary logs in `tracing-subscriber` syntax. An unparsable value is replaced with `info`. The targets `crane::audit`, `crane::access` and `crane::upstream` are always enabled at the `info` level"

# ── Переменные файла .env для Docker Compose (scope: compose) ──
