# Переменные окружения CRANE: источник шорткода {{< env >}}, подсказок в блоках кода
# и страницы reference/environment-variables. Только то, что читает код сейчас
# (crates/entry/server/src/config и main.rs), включая AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY; без CRANE_TEST_*. Ведёт руководитель документации; заполняет писатель справочника.
#
# Поля:
#   default   — значение по умолчанию как в коде; null — нет значения
#   required  — true, если сервер не стартует без переменной
#   file      — есть ли форма <ИМЯ>_FILE (отдельной записью не заводится)
#   secret    — значение секретное: значение по умолчанию не показывается, подсказка советует <ИМЯ>_FILE
#   toml      — ключ файла CRANE_CONFIG или null, если только окружение
#   anchor    — якорь строки на странице reference/environment-variables
#   ru/en     — одно предложение о назначении

CRANE_CONFIG:
  default: null
  required: false
  file: false
  secret: false
  toml: null
  anchor: crane-config
  ru: "Путь к необязательному файлу TOML с настройками; задаётся только окружением."
  en: "Path to an optional TOML settings file; set only through the environment."

CRANE_HTTP_PORT:
  default: "8080"
  required: false
  file: false
  secret: false
  toml: http_port
  anchor: crane-http-port
  ru: "Порт API: протоколы пакетов."
  en: "API port: the package protocols."

CRANE_ADMIN_PORT:
  default: "9464"
  required: false
  file: false
  secret: false
  toml: admin_port
  anchor: crane-admin-port
  ru: "Порт проб /healthz/live и /healthz/ready; его читает и команда crane healthcheck."
  en: "Port of the /healthz/live and /healthz/ready probes; the crane healthcheck command reads it too."

CRANE_PUBLIC_URL:
  default: null
  required: true
  file: false
  secret: false
  toml: public_url
  anchor: crane-public-url
  ru: "Внешний адрес CRANE (http:// или https://): от него строятся ссылки в ответах протоколов."
  en: "External address of CRANE (http:// or https://); links in protocol responses are built from it."

CRANE_TRUSTED_PROXIES:
  default: ""
  required: false
  file: false
  secret: false
  toml: trusted_proxies
  anchor: crane-trusted-proxies
  ru: "IP-адреса и сети CIDR через запятую, чьим заголовкам X-Forwarded-For и X-Request-Id верит сервер."
  en: "Comma-separated IP addresses and CIDR networks whose X-Forwarded-For and X-Request-Id headers the server trusts."

CRANE_TOKEN:
  default: null
  required: true
  file: true
  secret: true
  toml: token
  anchor: crane-token
  ru: "Статический токен доступа к протоколам пакетов; задаётся этой переменной или файлом, но не обоими."
  en: "Static access token for the package protocols; set by this variable or by a file, not both."

CRANE_TOKEN_PRINCIPAL:
  default: "crane"
  required: false
  file: false
  secret: false
  toml: token_principal
  anchor: crane-token-principal
  ru: "Имя принципала токена: оно попадает в журнал аудита, журнал доступа и ответ owners для cargo."
  en: "Name of the token principal; it appears in the audit log, the access log and the cargo owners response."

CRANE_DATABASE_URL:
  default: null
  required: true
  file: true
  secret: true
  toml: database_url
  anchor: crane-database-url
  ru: "Адрес каталога: postgres:// или postgresql:// либо memory для каталога в памяти."
  en: "Catalog address: postgres:// or postgresql://, or memory for an in-memory catalog."

CRANE_BLOBS:
  default: null
  required: true
  file: false
  secret: false
  toml: blobs
  anchor: crane-blobs
  ru: "Хранилище blob: memory, file:///абсолютный/путь или s3://бакет с несекретными параметрами запроса."
  en: "Blob storage: memory, file:///absolute/path or s3://bucket with non-secret query parameters."

CRANE_SETTINGS_KEY:
  default: null
  required: false
  file: true
  secret: true
  toml: settings_key
  anchor: crane-settings-key
  ru: "Ключ шифрования секретов настроек в PostgreSQL: base64 от 32 байт (AES-256-GCM)."
  en: "Encryption key for secret settings stored in PostgreSQL: base64 of 32 bytes (AES-256-GCM)."

CRANE_CACHE:
  default: "memory"
  required: false
  file: true
  secret: true
  toml: cache
  anchor: crane-cache
  ru: "Кэш proxy и координатор выборок: memory или адрес Valkey (valkey://, valkeys://, -cluster, -sentinel)."
  en: "Proxy cache and fetch coordinator: memory or a Valkey address (valkey://, valkeys://, -cluster, -sentinel)."

CRANE_PROXY_MAX_ARTIFACT_BYTES:
  default: "2147483648"
  required: false
  file: false
  secret: false
  toml: proxy_max_artifact_bytes
  anchor: crane-proxy-max-artifact-bytes
  ru: "Предел размера одного проксируемого артефакта в байтах; значение больше нуля."
  en: "Size limit of a single proxied artifact in bytes; the value must be greater than zero."

CRANE_MAX_PUBLISH_BYTES:
  default: "10485760"
  required: false
  file: false
  secret: false
  toml: max_publish_bytes
  anchor: crane-max-publish-bytes
  ru: "Предел размера тела публикации в байтах для cargo и npm; значение больше нуля."
  en: "Size limit of a publish request body in bytes for cargo and npm; the value must be greater than zero."

CRANE_CARGO_REPOS:
  default: "internal"
  required: false
  file: false
  secret: false
  toml: cargo_repos
  anchor: crane-cargo-repos
  ru: "Имена hosted-репозиториев Cargo через запятую."
  en: "Comma-separated names of the Cargo hosted repositories."

CRANE_CARGO_PROXY_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: cargo_proxy_repos
  anchor: crane-cargo-proxy-repos
  ru: "Имена proxy-репозиториев crates.io через запятую; пустое значение выключает proxy Cargo."
  en: "Comma-separated names of the crates.io proxy repositories; an empty value disables the Cargo proxy."

CRANE_NPM_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_repos
  anchor: crane-npm-repos
  ru: "Имена hosted-репозиториев npm через запятую; пустое значение не создаёт репозиториев."
  en: "Comma-separated names of the npm hosted repositories; an empty value creates none."

CRANE_NPM_PROXY_REPOS:
  default: ""
  required: false
  file: false
  secret: false
  toml: npm_proxy_repos
  anchor: crane-npm-proxy-repos
  ru: "Имена proxy-репозиториев registry.npmjs.org через запятую; пустое значение выключает proxy npm."
  en: "Comma-separated names of the registry.npmjs.org proxy repositories; an empty value disables the npm proxy."

CRANE_NAMESPACES:
  default: ""
  required: false
  file: false
  secret: false
  toml: namespaces
  anchor: crane-namespaces
  ru: "Резервирование внутренних имён: записи формат:шаблон или формат:шаблон=uuid-workspace через запятую."
  en: "Reserves internal names: comma-separated format:pattern or format:pattern=workspace-uuid entries."

AWS_ACCESS_KEY_ID:
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-access-key-id
  ru: "Идентификатор статического ключа S3; нужен вместе с AWS_SECRET_ACCESS_KEY при хранилище blob s3://."
  en: "Static S3 key identifier; used together with AWS_SECRET_ACCESS_KEY when blob storage is s3://."

AWS_SECRET_ACCESS_KEY:
  default: null
  required: false
  file: true
  secret: true
  toml: null
  anchor: aws-secret-access-key
  ru: "Секретная часть статического ключа S3; нужна вместе с AWS_ACCESS_KEY_ID."
  en: "Secret part of the static S3 key; used together with AWS_ACCESS_KEY_ID."

RUST_LOG:
  default: "info"
  required: false
  file: false
  secret: false
  toml: null
  anchor: rust-log
  ru: "Уровень обычных логов в синтаксисе tracing-subscriber; события журнала ИБ он не отключает."
  en: "Level of the ordinary logs in tracing-subscriber syntax; it does not turn off security journal events."
