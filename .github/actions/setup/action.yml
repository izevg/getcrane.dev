name: Подготовка среды
description: Node из .node-version, Hugo extended нужной версии (с проверкой контрольной суммы) и зависимости npm.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
    - name: Hugo extended
      shell: bash
      run: |
        set -euo pipefail
        v="$(node -p "require('./package.json').hugo")"
        base="https://github.com/gohugoio/hugo/releases/download/v${v}"
        archive="hugo_extended_${v}_linux-amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "${base}/${archive}"
        curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "${base}/hugo_${v}_checksums.txt"
        (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
        sudo install "$RUNNER_TEMP/hugo" /usr/local/bin/hugo
        hugo version
    - name: Зависимости
      shell: bash
      run: |
        if [ ! -f package-lock.json ]; then
          echo "::error::Нет package-lock.json. Выполните npm install в репозитории сайта и закоммитьте lock-файл: CI ставит зависимости только через npm ci."
          exit 1
        fi
        # Chromium для mermaid-cli в CI не нужен: диаграммы лежат в репозитории готовыми SVG (npm run mermaid выполняется локально).
        PUPPETEER_SKIP_DOWNLOAD=1 npm ci
