{{- /* Таблица в регионе со своим скроллом (WCAG 1.4.10). tabindex снимает остров, если таблица не переполнена. */ -}}
<div class="table-wrap" role="region" tabindex="0" aria-label="{{ i18n "table.default" }}" data-table>
<table>
  {{- with .THead }}
  <thead>
    {{- range . }}
    <tr>{{ range . }}<th scope="col"{{ with .Alignment }} class="ta-{{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
    {{- end }}
  </thead>
  {{- end }}
  <tbody>
    {{- range .TBody }}
    <tr>{{ range . }}<td{{ with .Alignment }} class="ta-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
    {{- end }}
  </tbody>
</table>
</div>
