name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    name: Контент и сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Типы (скрипты и острова)
        run: npm run typecheck
      - name: Исходники (паритет RU/EN, мета, слова, i18n, паритет версий)
        run: npm run check:content
      - name: Дорожная карта (версии, страницы, тексты, planned)
        run: npm run check:roadmap
      - name: Диаграммы (готовые SVG актуальны, без рендера)
        run: npm run mermaid:check
      - name: Иконки Lucide (манифест и файлы)
        run: npm run icons:check
      - name: Орфография RU и EN
        run: npm run check:spell
      - name: Сборка (Hugo → Pagefind → postbuild, без рендера диаграмм)
        run: npm run build
      - name: Внутренние ссылки
        run: npm run check:links
      - name: Собранный сайт (номера версий только в разрешённых элементах)
        run: npm run check:output
